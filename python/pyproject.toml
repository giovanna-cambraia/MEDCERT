[project]
name = "medcert-tools"
version = "0.1.0"
description = "FMEA tables, traceability matrices, and evidence-report generation for the IEC 62304 / IEC 60601-1 / IEC 60601-1-4 / ISO 14971 project."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

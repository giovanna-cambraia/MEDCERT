# source of truth for requirement -> code -> test traceability;
# one entry per requirement, across all four standards. `standard` picks which certification bucket it rolls up into; 
# `module` should match a directory name under src/device/ or ada/src/

# - id: HLR-001
#   standard: IEC-62304          # IEC-62304 | IEC-60601-1 | IEC-60601-1-4 | ISO-14971
#   module: example_module
#   text: "Placeholder requirement text."
#   code_refs: []                # e.g. ["src/device/example_module/source/example_module.c"]
#   test_refs: []                # e.g. ["tests/example_module/test_foo.c"]
#   status: draft                 # draft | implemented | verified

requirements:
  - id: REQ-SC-001
    standard: IEC-60601-1
    module: safety_controller
    text: >
      The safety controller shall clamp any commanded insulin dose it
      receives to no more than [max dose rate -- TBD] before forwarding
      it to the pump, independent of whether the dosing algorithm's
      computed value is correct.
    code_refs:
      - src/device/safety_controller/src/safety_controller.c
      - src/device/safety_controller/include/safety_controller.h
      - ada/src/safety_controller_ref/include/safety_controller_ref.ads
      - ada/src/safety_controller_ref/src/safety_controller_ref.adb
      - ada/src/safety_controller_ref/include/safety_controller_ref_demo.ads
    test_refs:
      - ada/src/safety_controller_ref/src/verify_oracle.adb
      - src/device/safety_controller/tests/test_safety_controller.c
    status: implemented
    # traces to SR-006 and FMEA-004/FMEA-007; Ada side: gnatprove --mode=prove, 4/4 checks; C side: test_safety_controller passes;
    # both use the arbitrary placeholder ceiling 100, not the real one; moves to verified once the real ceiling replaces the placeholder and both are re-run against it

  - id: REQ-SC-002
    standard: IEC-60601-1-4
    module: safety_controller
    text: >
      The safety controller shall reject (fail-safe: block the dose,
      do not pass it through) any dose command received via a corrupted,
      malformed, or unrecognized message on the main-controller interface.
    code_refs:
      - src/device/safety_controller/src/safety_controller.c
      - src/device/safety_controller/include/safety_controller.h
      - ada/src/safety_controller_ref/include/safety_controller_ref.ads
      - ada/src/safety_controller_ref/src/safety_controller_ref.adb
      - ada/src/safety_controller_ref/include/safety_controller_ref_demo.ads
    test_refs:
      - ada/src/safety_controller_ref/src/verify_oracle.adb
      - src/device/safety_controller/tests/test_safety_controller.c
    status: implemented
    # traces to HAZ-012 / FMEA-012. Same evidence as REQ-SC-001; the C test also covers a corrupted enum value (99), a case the Ada type
    # cannot represent
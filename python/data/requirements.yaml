# source of truth for requirement -> code -> test traceability;
# one entry per requirement, across all four standards. `standard` picks which certification bucket it rolls up into;
# `module` should match a directory name under src/device/ or ada/src/

# - id: HLR-001
#   standard: IEC-62304          # IEC-62304 | IEC-60601-1 | IEC-60601-1-4 | ISO-14971
#   module: example_module
#   text: "Placeholder requirement text."
#   code_refs: []                # e.g. ["src/device/example_module/source/example_module.c"]
#   test_refs: []                # e.g. ["tests/example_module/test_foo.c"]
#   status: draft                 # draft | implemented | verified

requirements:
  - id: REQ-SC-001
    standard: IEC-60601-1
    module: safety_controller
    text: >
      The safety controller shall clamp any commanded insulin dose it
      receives to no more than [max dose rate -- TBD] before forwarding
      it to the pump, independent of whether the dosing algorithm's
      computed value is correct.
    code_refs:
      - src/device/safety_controller/src/safety_controller.c
      - src/device/safety_controller/include/safety_controller.h
      - ada/src/safety_controller_ref/include/safety_controller_ref.ads
      - ada/src/safety_controller_ref/src/safety_controller_ref.adb
      - ada/src/safety_controller_ref/include/safety_controller_ref_demo.ads
    test_refs:
      - ada/src/safety_controller_ref/src/verify_oracle.adb
      - src/device/safety_controller/tests/test_safety_controller.c
    status: implemented
    # traces to SR-006 and FMEA-004/FMEA-007. Ada side: gnatprove --mode=prove, 4/4 checks. C side: test_safety_controller passes;
    # both use the arbitrary placeholder ceiling 100, not the real one; moves to verified once the real ceiling replaces the placeholder
    # and both are re-run against it

  - id: REQ-SC-002
    standard: IEC-60601-1-4
    module: safety_controller
    text: >
      The safety controller shall reject (fail-safe: block the dose,
      do not pass it through) any dose command received via a corrupted,
      malformed, or unrecognized message on the main-controller interface.
    code_refs:
      - src/device/safety_controller/src/safety_controller.c
      - src/device/safety_controller/include/safety_controller.h
      - ada/src/safety_controller_ref/include/safety_controller_ref.ads
      - ada/src/safety_controller_ref/src/safety_controller_ref.adb
      - ada/src/safety_controller_ref/include/safety_controller_ref_demo.ads
    test_refs:
      - ada/src/safety_controller_ref/src/verify_oracle.adb
      - src/device/safety_controller/tests/test_safety_controller.c
    status: implemented
    # traces to HAZ-012 / FMEA-012. Same evidence as REQ-SC-001; the C test also covers a corrupted enum value (99), a case the Ada type
    # cannot represent

  - id: REQ-SA-001
    standard: IEC-60601-1
    module: signal_acquisition
    text: >
      The device shall treat the CGM signal as lost if no valid reading
      has been received within [dropout timeout -- TBD], and shall then
      pass no glucose value to the dosing algorithm and shall raise a
      signal-loss indication, rather than reuse the last known reading.
    code_refs:
      - src/device/signal_acquisition/src/signal_acquisition.c
      - src/device/signal_acquisition/include/signal_acquisition.h
      - ada/src/signal_acquisition_ref/include/signal_acquisition_ref.ads
      - ada/src/signal_acquisition_ref/src/signal_acquisition_ref.adb
      - ada/src/signal_acquisition_ref/include/signal_acquisition_ref_demo.ads
    test_refs:
      - ada/src/signal_acquisition_ref/src/verify_sa_oracle.adb
      - src/device/signal_acquisition/tests/test_signal_acquisition.c
    status: implemented
    # traces to SR-001, EP-002, HAZ-002, FMEA-002; Ada side: gnatprove --mode=prove clean. C side: test_signal_acquisition passes;
    # both use placeholder values, not the real dropout timeout

  - id: REQ-SA-002
    standard: IEC-60601-1
    module: signal_acquisition
    text: >
      The device shall reject any glucose reading outside
      [plausible range min -- TBD] to [plausible range max -- TBD] and
      shall not pass it to the dosing algorithm.
    code_refs:
      - src/device/signal_acquisition/src/signal_acquisition.c
      - src/device/signal_acquisition/include/signal_acquisition.h
      - ada/src/signal_acquisition_ref/include/signal_acquisition_ref.ads
      - ada/src/signal_acquisition_ref/src/signal_acquisition_ref.adb
      - ada/src/signal_acquisition_ref/include/signal_acquisition_ref_demo.ads
    test_refs:
      - ada/src/signal_acquisition_ref/src/verify_sa_oracle.adb
      - src/device/signal_acquisition/tests/test_signal_acquisition.c
    status: implemented
    # traces to SR-002, EP-001, HAZ-001, HAZ-003, FMEA-003; same evidence as REQ-SA-001; Out-of-range check takes priority over the rate
    # check when both would fire (tested explicitly)

  - id: REQ-SA-003
    standard: IEC-60601-1
    module: signal_acquisition
    text: >
      The device shall reject any glucose reading whose change from the
      previous accepted reading exceeds [max physiological rate of
      change -- TBD] over the elapsed time, and shall not pass it to the
      dosing algorithm.
    code_refs:
      - src/device/signal_acquisition/src/signal_acquisition.c
      - src/device/signal_acquisition/include/signal_acquisition.h
      - ada/src/signal_acquisition_ref/include/signal_acquisition_ref.ads
      - ada/src/signal_acquisition_ref/src/signal_acquisition_ref.adb
      - ada/src/signal_acquisition_ref/include/signal_acquisition_ref_demo.ads
    test_refs:
      - ada/src/signal_acquisition_ref/src/verify_sa_oracle.adb
      - src/device/signal_acquisition/tests/test_signal_acquisition.c
    status: implemented
    # traces to SR-002, HAZ-003, FMEA-003. Same evidence as REQ-SA-001; rate check is skipped once a dropout has occurred (tested
    # explicitly), since there's nothing valid left to compare against

      - id: REQ-DA-001
    standard: IEC-62304
    module: dosing_algorithm
    text: >
      The dosing algorithm shall compute a dose only from the current
      validated glucose reading and a bounded recent history; it shall
      not dose on data older than [staleness bound -- TBD].
    code_refs: []
    test_refs: []
    status: draft
    # traces to SR-003, HAZ-004, HAZ-006, FMEA-004, FMEA-006

  - id: REQ-DA-002
    standard: IEC-62304
    module: dosing_algorithm
    text: >
      The dosing algorithm shall include a self-check (plausibility
      bound on its own output and a state-integrity check) before
      emitting a dose command, and shall fail to a no-dose / alarm
      state rather than emit an unchecked value.
    code_refs: []
    test_refs: []
    status: draft
    # traces to SR-004, HAZ-006, FMEA-006

  - id: REQ-DA-003
    standard: IEC-62304
    module: dosing_algorithm
    text: >
      The dosing algorithm shall re-evaluate its computed dose against
      the most recent glucose trend at a bounded cycle time
      [cycle time -- TBD], so that a rapidly changing glucose level is
      corrected within a bounded delay.
    code_refs: []
    test_refs: []
    status: draft
    # traces to SR-005, HAZ-005, FMEA-005

  - id: REQ-DA-004
    standard: IEC-60601-1-4
    module: dosing_algorithm
    text: >
      The dosing algorithm shall have no interface capable of
      commanding the pump directly; every computed dose shall be sent
      only to the safety controller interface.
    code_refs: []
    test_refs: []
    status: draft
    # this is the structural enforcement of the architecture decision ust confirmed (ALGO -> LIMIT -> PUMP, no direct ALGO -> PUMP
    # path); without this requirement, REQ-SC-001's clamp guarantee is only a diagram convention, not something that's actually checked;
    # new requirement, not previously named in the safety requirements doc -- worth adding there too once dosing_algorithm's interface
    # is designed